name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [healpipe, pipeboard]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Offline: synthetic fixtures only. No dataset download, no API keys.
      - run: pytest -q

  healpipe-replay:
    # Re-executes the recorded Claude run on the real public dataset. No API key.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healpipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python scripts/fetch_data.py
      - name: Replay recorded Claude decisions (fails on a stale recording)
        run: healpipe eval --planner replay

  ovary-spatial-tutorial:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ovary-spatial-tutorial
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene (denylist, data path, no committed data)
        run: bash tests/check_repo.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fetch_data.py compiles
        run: python -m py_compile scripts/fetch_data.py
      - uses: r-lib/actions/setup-r@v2
      - name: Every R chunk parses (no data needed)
        run: |
          Rscript -e 'install.packages("knitr", repos = "https://cloud.r-project.org")'
          Rscript -e 'out <- knitr::purl("ovary_analysis.Rmd", output = tempfile(fileext = ".R"), documentation = 0, quiet = TRUE); invisible(parse(out)); cat("all chunks parse\n")'
